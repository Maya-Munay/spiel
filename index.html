<!-- Gemeinsame Zeichen-Werkzeuge (Aquarell-Filter, Farbverläufe) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <filter id="aquarell" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="4" result="welle"/>

      <feComposite in="rand" in2="kornA" operator="in"/>

    <filter id="weich" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="2" result="w"/>

      <stop offset=".8" stop-color="#D9EBDD"/>

    <linearGradient id="dunst-nah" x1="0" y1="0" x2="0" y2="1">
