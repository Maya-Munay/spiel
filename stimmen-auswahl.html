<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stimmen anhören</title>
<style>
  @font-face { font-family: "MM Pagella"; src: url("assets/mm-pagella.woff") format("woff"); font-display: swap; }
  :root { --dunkel:#352E26; --braun:#7A5C48; --gold:#CBAE6F; --terrakotta:#C26547; --creme:#EFE6D5; --hell:#F7F2EA; --gruen:#7E8C58;
          --schrift: Palatino, "Palatino Linotype", "MM Pagella", "Book Antiqua", serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--hell); color: var(--dunkel); font-family: var(--schrift); line-height: 1.5; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 120px; }
  h1 { font-weight: normal; font-size: 2rem; margin: 0 0 4px; }
  h2 { font-weight: normal; font-size: 1.4rem; margin: 36px 0 4px; color: var(--braun); }
  .satz { font-style: italic; color: var(--braun); margin: 0 0 14px; }
  .raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .karte { background: #fff; border: 1.5px solid var(--creme); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; cursor: pointer; transition: border-color .2s, box-shadow .2s; }
  .karte:hover { border-color: var(--gold); }
  .karte.gewaehlt { border-color: var(--gruen); box-shadow: 0 0 0 3px rgba(126,140,88,.25); }
  .karte.spielt .play { background: var(--terrakotta); }
  .play { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--braun); color: var(--hell); font-size: 18px; cursor: pointer; }
  .nr { font-size: .8rem; color: var(--braun); letter-spacing: .04em; }
  .name { font-size: 1.05rem; }
  .haken { margin-left: auto; color: var(--gruen); font-size: 1.3rem; visibility: hidden; }
  .gewaehlt .haken { visibility: visible; }
  .leiste { position: fixed; left: 0; right: 0; bottom: 0; background: var(--dunkel); color: var(--hell); padding: 14px 16px; text-align: center; font-size: 1.05rem; }
  .leiste b { color: var(--gold); font-weight: normal; }
</style>
</head>
<body>
<main>
  <h1>Welche Stimmen gefallen dir?</h1>
  <p>Ein Klick auf ▶ spielt die Probe. Ein Klick auf die Karte merkt sich deine Wahl – unten steht dann, was du mir im Chat sagen magst.</p>
  <section id="kolibri"><h2>Kolibri</h2><p class="satz"></p><div class="raster"></div></section>
  <section id="wald"><h2>Der Wald – wie ein alter Geschichtenerzähler</h2><p class="satz"></p><div class="raster"></div></section>
</main>
<div class="leiste" id="leiste">Noch nichts gewählt.</div>
<script src="stimme/proben/proben.js"></script>
<script>
  const audio = new Audio(); let aktiv = null;
  const wahl = { kolibri: null, wald: null };
  for (const wer of ['kolibri', 'wald']) {
    const sek = document.getElementById(wer);
    sek.querySelector('.satz').textContent = '„' + PROBEN.texte[wer] + '“';
    PROBEN.liste.filter(p => p.wer === wer).forEach((p, i) => {
      const k = document.createElement('div'); k.className = 'karte';
      k.innerHTML = `<button class="play" aria-label="Probe abspielen">▶</button><div><div class="nr">${wer === 'kolibri' ? 'Kolibri' : 'Wald'} ${i + 1}</div><div class="name"></div></div><span class="haken">✓</span>`;
      k.querySelector('.name').textContent = p.name;
      p.label = `${wer === 'kolibri' ? 'Kolibri' : 'Wald'} ${i + 1} (${p.einstellung.voice})`;
      k.querySelector('.play').onclick = e => {
        e.stopPropagation();
        if (aktiv === k && !audio.paused) { audio.pause(); k.classList.remove('spielt'); return; }
        aktiv?.classList.remove('spielt'); aktiv = k; k.classList.add('spielt');
        audio.src = p.datei; audio.play();
      };
      k.onclick = () => { sek.querySelectorAll('.karte').forEach(x => x.classList.remove('gewaehlt')); k.classList.add('gewaehlt'); wahl[wer] = p; zeige(); };
      sek.querySelector('.raster').append(k);
    });
  }
  audio.onended = () => aktiv?.classList.remove('spielt');
  function zeige() {
    const t = [wahl.kolibri && wahl.kolibri.label, wahl.wald && wahl.wald.label].filter(Boolean);
    document.getElementById('leiste').innerHTML = 'Deine Wahl: <b>' + t.join(' · ') + '</b>';
  }
</script>
</body>
</html>
